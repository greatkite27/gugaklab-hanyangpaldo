<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon (브라우저 탭, 주소창) -->
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

  <!-- iOS 홈 화면 아이콘 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <!-- PWA Manifest (Edge/Chrome 앱 아이콘용) -->
  <link rel="manifest" href="/manifest.json">

  <!-- Edge / 모바일 브라우저 색상 -->
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="theme-color" content="#000000">

  <title>국악LAB 한양팔도 - CONTACT</title>

  <!-- 공통 스타일 & 레이아웃 -->
  <link rel="stylesheet" href="common.css" />
  <script src="layout.js" defer></script>

  <style>
    /* =========================
       CONTACT: HERO
       ========================= */
    .contact-hero {
      padding-top: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .contact-hero .kicker {
      margin-bottom: 0.4rem;
    }

    .contact-hero h2 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
    }

    .contact-hero .lead {
      max-width: 42rem;
      letter-spacing: -0.01em;
    }

    /* =========================
       CONTACT: GRID
       ========================= */
    .contact-grid {
      margin-top: 2.5rem;
      margin-bottom: 3rem;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2.5rem;
    }

    /* =========================
       LEFT: INFO & MAP
       ========================= */
    .contact-info-block h3 {
      margin: 0 0 1rem;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
      font-weight: 600;
    }

    .contact-info {
      font-size: 0.95rem;
      line-height: 1.75;
      color: #dddddd;
      letter-spacing: -0.01em;
    }

    .contact-info a {
      color: #8ba4ff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-info a:hover {
      color: #b5c7ff;
      text-decoration: underline;
    }

    /* GOOGLE MAP EMBED */
    .map-embed-wrap {
      margin-top: 1.2rem;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      width: 100%;
      padding-bottom: 60%;
      height: 0;
      background: #111111;
    }

    .map-embed-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      filter: grayscale(20%) invert(90%) hue-rotate(180deg);
    }

    /* =========================
       RIGHT: FORM
       ========================= */
    .contact-form h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
      font-weight: 600;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.1rem;
    }

    .form-field label {
      font-size: 0.82rem;
      color: #aaaaaa;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }

    .form-field input,
    .form-field textarea {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: #ffffff;
      resize: none;
      font-size: 0.95rem;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: #8ba4ff;
      background: rgba(255,255,255,0.09);
      outline: none;
    }

    .contact-submit-btn {
      width: 100%;
      padding: 0.85rem 1.4rem;
      background: #ffffff;
      color: #000000;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.15s ease;
    }

    .contact-submit-btn:hover {
      background-color: #f0f0f0;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,255,255,0.15);
    }

    /* =========================
       모바일 & 태블릿 반응형 최적화
       ========================= */
    @media (max-width: 820px) {
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 2.2rem;
        margin-top: 2rem;
        margin-bottom: 2.5rem;
      }
    }

    @media (max-width: 768px) {
      .contact-hero {
        padding-top: 2rem;
        padding-bottom: 1.5rem;
      }

      /* HERO h2 폰트 크기 변경 삭제: 아티스트 페이지와 똑같이 모바일에서도 font-size: 2rem 유지 */

      .contact-info-block h3,
      .contact-form h3 {
        font-size: 1.1rem;
        letter-spacing: -0.02em;
      }

      .contact-info {
        font-size: 0.88rem;
        line-height: 1.65;
        letter-spacing: -0.02em;
      }

      .map-embed-wrap {
        border-radius: 14px;
        padding-bottom: 65%;
      }

      .form-field label {
        font-size: 0.8rem;
        letter-spacing: -0.02em;
      }

      .form-field input,
      .form-field textarea {
        font-size: 0.9rem;
        padding: 0.75rem 0.9rem;
        border-radius: 8px;
      }

      .contact-submit-btn {
        font-size: 0.9rem;
        padding: 0.8rem 1.2rem;
      }
    }

    @media (max-width: 480px) {
      /* HERO h2 폰트 크기 변경 삭제: 모바일에서도 font-size: 2rem 유지 */

      .contact-info {
        font-size: 0.84rem;
      }
    }
  </style>
</head>

<body>

<header></header>
<nav></nav>

<main>

  <!-- HERO -->


  <!-- GRID -->
  <section class="section">
    <div class="contact-grid">

      <!-- LEFT: INFORMATION -->
      <div>
        <div class="contact-info-block">
          <h3>연락처 및 오시는 길</h3>
          <div class="contact-info">
            서울특별시 서초구 효령로 229 B1층 B07호<br />
            이메일:
            <a href="mailto:gugaklab@naver.com">gugaklab@naver.com</a><br />
            인스타그램:
            <a href="https://www.instagram.com/hanyangpaldo" target="_blank" rel="noopener noreferrer">@hanyangpaldo</a>
          </div>

          <!-- GOOGLE MAP EMBED -->
          <div class="map-embed-wrap">
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m5!3m3!1m2!1s0x357ca1007cfe5af9%3A0x9647f39700f5e4d8!2z6rWt7JWFTEFCIO2VnOyWke2MlOuPhA!5e0!3m2!1sko!2skr!4v1789985227451!5m2!1sko!2skr" 
              width="100%" 
              height="100%" 
              style="border:0;" 
              allowfullscreen="" 
              loading="lazy" 
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
          </div>
        </div>
      </div>

      <!-- RIGHT: CONTACT FORM -->
      <div class="contact-form">
        <h3>문의하기</h3>

        <form action="mailto:gugaklab@naver.com" method="POST" enctype="text/plain">

          <div class="form-field">
            <label for="user-name">이름</label>
            <input type="text" id="user-name" name="name" required />
          </div>

          <div class="form-field">
            <label for="user-email">이메일</label>
            <input type="email" id="user-email" name="email" required />
          </div>

          <div class="form-field">
            <label for="user-message">문의 내용</label>
            <textarea id="user-message" name="message" rows="6" required></textarea>
          </div>

          <button type="submit" class="contact-submit-btn">메시지 보내기</button>

        </form>
      </div>

    </div>
  </section>

</main>

<footer class="site-footer"></footer>

</body>
</html>
