<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

  <!-- iOS 홈 화면 아이콘 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Edge / 모바일 브라우저 색상 -->
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="theme-color" content="#000000">

  <title>국악LAB 한양팔도 - VIDEOS</title>
  <link rel="stylesheet" href="common.css" />
  <script src="layout.js" defer></script>

  <style>
    /* =========================
       VIDEOS: HERO
       ========================= */
    .videos-hero {
      padding-top: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .videos-hero .kicker {
      margin-bottom: 0.4rem;
    }

    .videos-hero h2 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    /* =========================
       채널 상단 배너
       ========================= */
    .channel-banner-large {
      padding: 2.2rem 2rem;
      border-radius: 18px;
      background: radial-gradient(circle at top left, rgba(255, 0, 0, 0.12), rgba(20, 20, 20, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .channel-info-large {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex: 1;
      min-width: 280px;
    }

    .channel-icon-large {
      width: 64px;
      height: 64px;
      background: #ff0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
    }

    .channel-text-large {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .channel-title-large {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .channel-sub-large {
      font-size: 0.92rem;
      color: #cccccc;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .channel-subscribe-btn-large {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      background-color: #ff0000;
      color: #ffffff;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: background-color 0.2s ease, transform 0.18s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
      white-space: nowrap;
    }

    .channel-subscribe-btn-large:hover {
      background-color: #e60000;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 0, 0, 0.45);
    }

    /* =========================
       YOUTUBE EMBED CONTAINER
       ========================= */
    .youtube-embed-section {
      margin-top: 2.5rem;
      margin-bottom: 4rem;
      width: 100%;
    }

    .youtube-embed-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 비율 유지 */
      height: 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .youtube-embed-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* =========================
       모바일 & 태블릿 반응형 최적화
       ========================= */
    @media (max-width: 768px) {
      .videos-hero {
        padding-top: 2rem;
        padding-bottom: 1.5rem;
      }

      .videos-hero h2 {
        font-size: 1.5rem;
        letter-spacing: -0.025em;
        margin-bottom: 1.2rem;
      }

      .channel-banner-large {
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem 1.2rem;
        border-radius: 14px;
        gap: 1.2rem;
      }

      .channel-info-large {
        gap: 1rem;
        min-width: 100%;
      }

      .channel-icon-large {
        width: 52px;
        height: 52px;
      }

      .channel-icon-large svg {
        width: 28px;
        height: 28px;
      }

      .channel-title-large {
        font-size: 1.1rem;
        letter-spacing: -0.025em;
      }

      .channel-sub-large {
        font-size: 0.84rem;
        line-height: 1.45;
        letter-spacing: -0.02em;
      }

      .channel-subscribe-btn-large {
        width: 100%;
        padding: 0.8rem 1rem;
        font-size: 0.9rem;
      }

      .youtube-embed-section {
        margin-top: 1.8rem;
        margin-bottom: 2.5rem;
      }

      .youtube-embed-wrap {
        border-radius: 14px;
      }
    }

    @media (max-width: 480px) {
      .videos-hero h2 {
        font-size: 1.35rem;
      }

      .channel-icon-large {
        width: 44px;
        height: 44px;
      }

      .channel-icon-large svg {
        width: 24px;
        height: 24px;
      }

      .channel-title-large {
        font-size: 1.02rem;
      }

      .channel-sub-large {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<header></header>
<nav></nav>

<main>

  <!-- HERO -->
  <section class="section videos-hero">
    <!-- 국악LAB 한양팔도 채널 (상단 배너) -->
    <div class="channel-banner-large">
      <div class="channel-info-large">
        <div class="channel-icon-large">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </div>
        <div class="channel-text-large">
          <span class="channel-title-large">국악LAB 한양팔도 공식 유튜브 채널</span>
          <span class="channel-sub-large">공연 실황, 리허설 스케치, 멤버 인터뷰 등 더 많은 비디오 콘텐츠를 유튜브에서 만나보세요.</span>
        </div>
      </div>
      <a href="https://www.youtube.com/@국악LAB한양팔도?sub_confirmation=1" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="channel-subscribe-btn-large">
        유튜브 채널 바로가기
      </a>
    </div>
  </section>

  <!-- 대표 유튜브 영상 임베드 영역 -->
  <section class="section youtube-embed-section">
    <div class="youtube-embed-wrap">
      <iframe 
        id="main-youtube-player"
        src="" 
        title="국악LAB 한양팔도 대표 영상" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>
  </section>

</main>

<script>
  // =====================================================================
  // [유튜브 링크 추가 방법]
  // 큰따옴표("") 안에 보여주고 싶은 유튜브 링크를 그대로 넣어주세요.
  // 예시: "https://www.youtube.com/watch?v=9gmQNSYlXIM" 또는 "https://youtu.be/9gmQNSYlXIM"
  // =====================================================================
  const youtubeLinks = [
    "https://www.youtube.com/watch?v=9gmQNSYlXIM"
  ];

  function extractVideoId(url) {
    if (!url) return "";
    let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
    return match ? match[1] : url; 
  }

  window.addEventListener("DOMContentLoaded", () => {
    const iframe = document.getElementById("main-youtube-player");
    if (youtubeLinks.length > 0 && youtubeLinks[0] !== "https://www.youtube.com/watch?v=9gmQNSYlXIM&t=1s") {
      const videoId = extractVideoId(youtubeLinks[0]);
      if (videoId) {
        iframe.src = `https://www.youtube.com/embed/${videoId}`;
      }
    }
  });
</script>

<footer class="site-footer"></footer>

</body>
</html>
