<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

  <!-- iOS 홈 화면 아이콘 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Edge / 모바일 브라우저 색상 -->
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="theme-color" content="#000000">

  <title>국악LAB 한양팔도 - VIDEOS</title>
  <link rel="stylesheet" href="common.css" />
  <script src="layout.js" defer></script>

  <style>
    /* HERO */
    .videos-hero {
      padding-top: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.14); /* (바) : 구분선 */
    }

    .videos-hero .kicker {
      margin-bottom: 0.4rem;
    }

    .videos-hero h2 {
      font-size: 2rem;
      letter-spacing: 0.08em;
      margin-bottom: 1.5rem;
    }

    /* ONLY 국악LAB 한양팔도 채널 (상단 배너) */
    .channel-banner-large {
      padding: 2.5rem 2rem;
      border-radius: 20px;
      background: radial-gradient(circle at top left, rgba(255, 0, 0, 0.12), rgba(20, 20, 20, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.8rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .channel-info-large {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .channel-icon-large {
      width: 72px;
      height: 72px;
      background: #ff0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
    }

    .channel-text-large {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .channel-title-large {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .channel-sub-large {
      font-size: 0.98rem;
      color: #cccccc;
      line-height: 1.4;
    }

    .channel-subscribe-btn-large {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2rem;
      background-color: #ff0000;
      color: #ffffff;
      border-radius: 999px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: background-color 0.2s ease, transform 0.18s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    }

    .channel-subscribe-btn-large:hover {
      background-color: #e60000;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
    }

    /* YOUTUBE EMBED CONTAINER (기존 퍼포먼스 영상 6개 클릭커 위치) */
    .youtube-embed-section {
      margin-top: 2.5rem;
      margin-bottom: 4rem;
      width: 100%;
    }

    .youtube-embed-wrap {
      position: relative;
      width: 100%;
      /* 16:9 비율 유지 또는 필요 시 height 지정 가능 */
      padding-bottom: 56.25%; 
      height: 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .youtube-embed-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 768px) {
      .channel-banner-large {
        flex-direction: column;
        align-items: flex-start;
        padding: 1.8rem 1.4rem;
      }
      .channel-subscribe-btn-large {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<header></header>
<nav></nav>

<main>

  <!-- HERO -->
  <section class="section videos-hero">
    <div class="kicker">VIDEOS</div>
    <h2>VIDEOS</h2>

    <!-- (바) -------------------------- -->
    <!-- 국악LAB 한양팔도 채널 (상단 배너) -->
    <div class="channel-banner-large">
      <div class="channel-info-large">
        <div class="channel-icon-large">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </div>
        <div class="channel-text-large">
          <span class="channel-title-large">국악LAB 한양팔도 공식 유튜브 채널</span>
          <span class="channel-sub-large">공연 실황, 리허설 스케치, 멤버 인터뷰 등 더 많은 비디오 콘텐츠를 유튜브에서 만나보세요.</span>
        </div>
      </div>
      <a href="https://www.youtube.com/@국악LAB한양팔도?sub_confirmation=1" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="channel-subscribe-btn-large">
        유튜브 채널 바로가기
      </a>
    </div>
    <!-- (바) -------------------------- -->
  </section>

  <!-- (기존 6개 퍼포먼스 영상 삭제 후 유튜브 채널/재생목록 임베드 영역 배치) -->
  <section class="section youtube-embed-section">
    <div class="youtube-embed-wrap">
      <!-- 
        * src 속성에 유튜브 채널의 대표 재생목록 ID(list=PLAYLIST_ID) 또는 업로드 영상 목록 ID를 넣어주세요.
        * 예시: https://www.youtube.com/embed/videoseries?list=UUxxxxxx (채널 업로드 전체 목록)
      -->
      <iframe 
        src="https://www.youtube.com/@%EA%B5%AD%EC%95%85LAB%ED%95%9C%EC%96%91%ED%8C%94%EB%8F%84" 
        title="국악LAB 한양팔도 공식 유튜브" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>
  </section>

</main>

<footer class="site-footer"></footer>

</body>
</html>
